services:
  - type: web
    name: pesu-slot-booking-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        sync: false
      - key: PESU_AUTH_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "1"
      - key: RATE_LIMIT_LOGIN
        value: "10/minute"
      - key: ADMIN_EMPLOYEE_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CANCEL_WINDOW_HOURS
        value: "2"
      - key: BAN_DURATION_DAYS
        value: "2"
